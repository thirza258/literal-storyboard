map $http_accept $want_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space, so unknown paths must fall through to the
    # SPA shell rather than 404 — otherwise a refresh on /about breaks.

    # Agent discovery documents
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /llms.txt {
        types { text/markdown txt; }
        default_type text/markdown;
    }

    location = /auth.md {
        default_type text/markdown;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = / {
        if ($want_markdown) { rewrite ^ /llms.txt last; }
    add_header Link '</.well-known/api-catalog>; rel="api-catalog", </auth.md>; rel="describedby"; type="text/markdown", </.well-known/agent-card.json>; rel="a2a-agent-card", </.well-known/ai-catalog.json>; rel="ai-catalog"' always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    # One header only — `expires` emits its own Cache-Control and would collide.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must not be cached, or players keep loading a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
